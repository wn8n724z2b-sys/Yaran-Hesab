name: Build Yaran for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        working-directory: Yaran-Native-v1-Alpha-CloudBuild
        run: npm install

      - name: Build Yaran
        working-directory: Yaran-Native-v1-Alpha-CloudBuild
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Yaran-Windows-Installer
          path: |
            Yaran-Native-v1-Alpha-CloudBuild/src-tauri/target/release/bundle/nsis/*.exe
            Yaran-Native-v1-Alpha-CloudBuild/src-tauri/target/release/*.exe
          if-no-files-found: error
